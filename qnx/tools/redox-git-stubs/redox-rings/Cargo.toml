# Stand-in for redox-rings at c56099c15a30636e7a528a6b37676daa7d9b6788, from
# https://gitlab.redox-os.org/redox-os/redox-rings.git: the same name, version, features and
# dependencies, and no code. Generated by qnx/tools/refresh-redox-stubs.py.
[package]
name = "redox-rings"
version = "0.1.0"
edition = "2024"

[features]
default = ["std", "sync", "userspace"]
std = ["libredox"]
sync = []
userspace = []

[dependencies]
libredox = { version = "0.1.18", default-features = false, features = ["redox_syscall", "call"], optional = true}
redox_syscall = "0.9.0"
zerocopy = { version = "0.8.55", features = ["derive"] }
bitflags = "2.13.1"

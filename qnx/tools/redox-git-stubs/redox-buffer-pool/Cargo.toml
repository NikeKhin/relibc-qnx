# Stand-in for redox-buffer-pool at 259719734304f6d2138b8b910fbdac663ebe6ff0, from
# https://gitlab.redox-os.org/redox-os/redox-buffer-pool.git: the same name, version, features and
# dependencies, and no code. Generated by qnx/tools/refresh-redox-stubs.py.
[package]
name = "redox-buffer-pool"
version = "0.6.0"
edition = "2024"
license = "MIT"

[features]
default = ["std"]
std = ["parking_lot", "guard-trait/default", "log/std", "spinning?/default"]
redox = ["redox_syscall"]

[dependencies]
guard-trait = { version = "0.4", default-features = false }
log = { version = "0.4", default-features = false }
parking_lot = { version = "0.12", features = ["nightly"], optional = true }
spinning = { version = "0.1", default-features = false, optional = true }
redox_syscall = { version = "0.9", optional = true }
